<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PK-XMD • QR Connect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ THEME ============ */
    :root {
      --c1: #00f5ff;
      --c2: #ff2bd6;
      --c3: #7c3aed;
      --c4: #22d3ee;
      --success: #00ff9d;
      --error: #ff3366;
      --bg-0: #03040f;
      --bg-1: #080a1a;
      --bg-2: #0d1126;
      --text: #e8ecff;
      --muted: #6b7394;
      --glass: rgba(255,255,255,0.04);
      --border: rgba(0,245,255,0.18);
      --border-dim: rgba(255,255,255,0.06);
      --glow-1: rgba(0,245,255,0.35);
      --glow-2: rgba(255,43,214,0.35);
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-0);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow-x: hidden;
      padding: 20px 16px 40px;
      position: relative;
    }

    /* ============ ANIMATED BACKGROUND ============ */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(100px); opacity: 0.5;
      animation: float 16s ease-in-out infinite;
    }
    .orb.a { width: 380px; height: 380px; background: var(--c1); top: -120px; left: -100px; }
    .orb.b { width: 420px; height: 420px; background: var(--c2); bottom: -160px; right: -140px; animation-delay: -6s; }
    .orb.c { width: 300px; height: 300px; background: var(--c3); top: 45%; left: 60%; animation-delay: -10s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(40px,-40px) scale(1.15); }
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      z-index: 0; pointer-events: none;
    }

    /* ============ WRAPPER ============ */
    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      display: flex; flex-direction: column; gap: 16px;
      animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============ TOP STATUS PILL ============ */
    .header-badge {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 8px 16px;
      background: var(--glass);
      border: 1px solid var(--border-dim);
      border-radius: 99px;
      align-self: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .badge-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .badge-dot.loading { background: var(--c1); box-shadow: 0 0 10px var(--c1); }
    .badge-dot.error { background: var(--error); box-shadow: 0 0 10px var(--error); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    .badge-text {
      font-size: 11px; font-weight: 700;
      color: var(--success);
      letter-spacing: 2.5px; text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }
    .badge-text.loading { color: var(--c1); }
    .badge-text.error { color: var(--error); }

    /* ============ MAIN CARD ============ */
    .card {
      background: linear-gradient(180deg, rgba(13,17,38,0.95), rgba(8,10,26,0.95));
      border: 1px solid var(--border-dim);
      border-radius: 28px;
      padding: 32px 28px;
      position: relative; overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    /* Animated top border */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--c1), var(--c2), var(--c3), transparent);
      background-size: 200% 100%;
      animation: borderSlide 4s linear infinite;
    }
    @keyframes borderSlide {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ============ BRAND ============ */
    .brand {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; margin-bottom: 24px;
    }
    .logo-ring {
      position: relative; width: 84px; height: 84px;
      margin-bottom: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-ring svg.ring {
      position: absolute; inset: 0;
      animation: spin 10s linear infinite;
      filter: drop-shadow(0 0 10px var(--glow-1));
    }
    .logo-ring svg.ring.rev {
      animation: spinReverse 14s linear infinite;
      filter: drop-shadow(0 0 10px var(--glow-2));
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }

    .logo-image {
      position: relative; z-index: 2;
      width: 56px; height: 56px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 28px var(--glow-1);
    }
    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px; font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 20%, var(--c1) 50%, var(--c2) 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p {
      font-size: 11px; color: var(--muted);
      margin-top: 6px; letter-spacing: 2px;
      text-transform: uppercase;
    }

    .divider { height: 1px; background: var(--border-dim); margin-bottom: 24px; }

    /* ============ QR AREA ============ */
    .qr-area {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .qr-frame {
      width: 250px; height: 250px;
      border-radius: 20px;
      background: var(--bg-2);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      box-shadow:
        0 0 0 1px var(--border),
        0 0 40px rgba(0,245,255,0.15),
        inset 0 0 40px rgba(0,245,255,0.03);
      transition: box-shadow 0.4s;
    }
    /* Scanning beam */
    .qr-frame::after {
      content: '';
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--c1), var(--c4), transparent);
      box-shadow: 0 0 12px var(--c1);
      animation: scanBeam 2.4s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .qr-frame.scanning::after { opacity: 1; }
    @keyframes scanBeam {
      0%   { top: 8%; }
      50%  { top: 92%; }
      100% { top: 8%; }
    }
    /* Corner brackets */
    .qr-corner {
      position: absolute; width: 22px; height: 22px;
      border: 2px solid var(--c1);
      opacity: 0.7;
    }
    .qr-corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
    .qr-corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
    .qr-corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
    .qr-corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

    .qr-frame img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 18px;
      display: none;
      padding: 10px;
    }
    .qr-spinner {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      z-index: 2;
    }
    .spinner-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border-dim);
      border-top-color: var(--c1);
      border-right-color: var(--c2);
      border-radius: 50%;
      animation: rotate 0.9s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .spinner-text {
      font-size: 12px; color: var(--muted);
      font-weight: 500; letter-spacing: 0.5px;
    }

    /* ============ STATUS ROW ============ */
    .status-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 600;
      color: var(--muted); text-align: center;
    }
    .status-icon { font-size: 16px; color: var(--c1); }
    .status-row.ok .status-icon { color: var(--success); }
    .status-row.err .status-icon { color: var(--error); }
    .status-row.err { color: var(--error); }
    .status-row.ok { color: var(--success); }

    /* ============ TIMER ============ */
    .timer-bar {
      width: 100%; height: 3px;
      background: var(--bg-2);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .timer-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, var(--c1), var(--c2));
      border-radius: 99px;
      transform-origin: left;
      transition: transform 1s linear, background 0.5s;
    }
    .timer-fill.warn { background: linear-gradient(90deg, #ffb020, var(--error)); }
    .timer-label {
      font-size: 11px; color: var(--muted);
      text-align: center; letter-spacing: 0.5px;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ============ STEPS ============ */
    .steps {
      display: none; flex-direction: column; gap: 10px;
      width: 100%; margin-top: 4px;
    }
    .step {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--muted);
      padding: 8px 12px;
      background: var(--glass);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      transition: 0.3s;
    }
    .step:hover { border-color: var(--border); transform: translateX(3px); }
    .step-num {
      width: 24px; height: 24px; min-width: 24px;
      background: linear-gradient(135deg, var(--c1), var(--c3));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #03040f;
      font-family: 'Orbitron', sans-serif;
    }

    /* ============ BUTTONS ============ */
    .btn-action {
      width: 100%; height: 52px;
      background: linear-gradient(135deg, var(--c1), var(--c3), var(--c2));
      background-size: 200% 200%;
      animation: gradMove 5s ease infinite;
      border: none; border-radius: 14px;
      color: #03040f; font-size: 13px; font-weight: 800;
      font-family: 'Orbitron', sans-serif; letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px var(--glow-1);
      display: none;
    }
    @keyframes gradMove {
      0%,100% { background-position: 0% 50%; }
      50%     { background-position: 100% 50%; }
    }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--glow-2); }
    .btn-action:active { transform: translateY(0); }
    .btn-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
      transform: translateX(-100%);
    }
    .btn-action:hover .btn-shimmer { animation: shimmer 1.2s ease forwards; }
    @keyframes shimmer { to { transform: translateX(100%); } }

    /* ============ SECONDARY BUTTONS ============ */
    .btn-row {
      display: flex; gap: 10px; width: 100%;
    }
    .btn-secondary {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--border-dim);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.5px;
    }
    .btn-secondary:hover {
      border-color: var(--c1);
      background: rgba(0,245,255,0.08);
      transform: translateY(-2px);
    }
    .btn-secondary.active {
      background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(255,43,214,0.15));
      border-color: var(--c1);
    }
    .btn-secondary i { color: var(--c1); }

    /* ============ VOICE FLOATING BUTTON ============ */
    .voice-fab {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--c3), var(--c2));
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px var(--glow-2);
      transition: transform 0.3s;
    }
    .voice-fab:hover { transform: scale(1.08) rotate(-5deg); }
    .voice-fab.listening {
      animation: voicePulse 1.2s infinite;
      background: linear-gradient(135deg, var(--c1), var(--c4));
    }
    @keyframes voicePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,245,255,0.7); }
      50%     { box-shadow: 0 0 0 16px rgba(0,245,255,0); }
    }
    .voice-fab .pulse-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid var(--c1);
      opacity: 0;
      pointer-events: none;
    }
    .voice-fab.listening .pulse-ring {
      animation: ringExpand 1.5s infinite;
    }
    @keyframes ringExpand {
      0%   { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0;   transform: scale(1.8); }
    }

    /* ============ FOOTER ============ */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 0 8px;
      line-height: 1.8;
    }
    .footer-note a { color: var(--c1); text-decoration: none; transition: 0.2s; }
    .footer-note a:hover { color: var(--c2); text-decoration: underline; }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: var(--bg-2);
      border: 1px solid var(--c1);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px; font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 32px var(--glow-1);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
      max-width: 320px;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast i { color: var(--c1); }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 380px) {
      .card { padding: 24px 16px; }
      .qr-frame { width: 210px; height: 210px; }
      .voice-fab { width: 54px; height: 54px; font-size: 20px; bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastText"></span></div>

  <!-- Voice FAB -->
  <button class="voice-fab" id="voiceFab" title="Voice assistant">
    <span class="pulse-ring"></span>
    <i class="fas fa-microphone"></i>
  </button>

  <div class="wrapper">

    <!-- Status pill -->
    <div class="header-badge">
      <div class="badge-dot loading" id="statusDot"></div>
      <span class="badge-text loading" id="statusBadge">Generating QR</span>
    </div>

    <!-- Main card -->
    <div class="card">
      <div class="brand">
        <div class="logo-ring">
          <svg class="ring" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="42" cy="42" r="39" stroke="url(#g1)" stroke-width="1.5" stroke-dasharray="8 6"/>
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="84" y2="84">
                <stop stop-color="#00f5ff"/>
                <stop offset="1" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
          <svg class="ring rev" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="42" cy="42" r="34" stroke="url(#g2)" stroke-width="1" stroke-dasharray="4 8"/>
            <defs>
              <linearGradient id="g2" x1="0" y1="0" x2="84" y2="84">
                <stop stop-color="#ff2bd6"/>
                <stop offset="1" stop-color="#22d3ee"/>
              </linearGradient>
            </defs>
          </svg>
          <img src="https://url.bmbxmd.workers.dev/ZNAII.jpg" alt="PK-XMD" class="logo-image" />
        </div>
        <h1>PK-XMD QR</h1>
        <p>Scan • Link • Connect</p>
      </div>

      <div class="divider"></div>

      <div class="qr-area">
        <!-- QR frame -->
        <div class="qr-frame" id="qrFrame">
          <div class="qr-corner tl"></div>
          <div class="qr-corner tr"></div>
          <div class="qr-corner bl"></div>
          <div class="qr-corner br"></div>
          <div class="qr-spinner" id="qrSpinner">
            <div class="spinner-ring"></div>
            <span class="spinner-text">Connecting to WhatsApp…</span>
          </div>
          <img id="qrImg" alt="QR Code">
        </div>

        <!-- Status row -->
        <div class="status-row" id="statusRow">
          <i class="fas fa-circle-notch fa-spin status-icon" id="statusIcon"></i>
          <span id="statusText">Generating your QR code…</span>
        </div>

        <!-- Timer -->
        <div class="timer-bar" id="timerBar"><div class="timer-fill" id="timerFill"></div></div>
        <span class="timer-label" id="timerLabel"></span>

        <!-- Steps -->
        <div class="steps" id="steps">
          <div class="step"><div class="step-num">1</div><span>Open WhatsApp on your phone</span></div>
          <div class="step"><div class="step-num">2</div><span>Tap <strong>Linked Devices</strong> → <strong>Link a Device</strong></span></div>
          <div class="step"><div class="step-num">3</div><span>Scan the QR code above</span></div>
        </div>

        <!-- Refresh button -->
        <button class="btn-action" id="btnRefresh" onclick="loadQr()">
          <div class="btn-shimmer"></div>
          <i class="fas fa-sync-alt" style="margin-right:8px"></i> Get New QR
        </button>

        <!-- Secondary buttons row -->
        <div class="btn-row">
          <button class="btn-secondary" id="btnSpeak" title="Read status aloud">
            <i class="fas fa-volume-up"></i> Speak
          </button>
          <button class="btn-secondary" id="btnDownload" title="Download QR">
            <i class="fas fa-download"></i> Save
          </button>
          <button class="btn-secondary" id="btnHelp" title="Voice help">
            <i class="fas fa-question-circle"></i> Help
          </button>
        </div>
      </div>
    </div>

    <p class="footer-note">
      Powered by <a href="https://github.com/officialpkdiller/PK-XMD" target="_blank">PK-XMD</a> ·
      <a href="https://wa.me/254799056874" target="_blank">Support</a>
    </p>
  </div>

  <script>
    /* ==========================================================
       ELEMENT REFERENCES
       ========================================================== */
    const dot        = document.getElementById('statusDot');
    const badge      = document.getElementById('statusBadge');
    const spinner    = document.getElementById('qrSpinner');
    const img        = document.getElementById('qrImg');
    const qrFrame    = document.getElementById('qrFrame');
    const statusRow  = document.getElementById('statusRow');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const timerBar   = document.getElementById('timerBar');
    const timerFill  = document.getElementById('timerFill');
    const timerLabel = document.getElementById('timerLabel');
    const btnRefresh = document.getElementById('btnRefresh');
    const steps      = document.getElementById('steps');
    const btnSpeak   = document.getElementById('btnSpeak');
    const btnDownload= document.getElementById('btnDownload');
    const btnHelp    = document.getElementById('btnHelp');
    const toast      = document.getElementById('toast');
    const toastText  = document.getElementById('toastText');
    const voiceFab   = document.getElementById('voiceFab');

    let timerInterval = null;
    let autoRefreshTimeout = null;
    let currentStatus = '';
    let currentQrUrl = null;

    /* ==========================================================
       VOICE ENGINE (TTS + STT)
       ========================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;
    let voiceEnabled = true;

    function speak(text, opts = {}) {
      if (!voiceEnabled || !('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = opts.rate || 1;
      u.pitch = opts.pitch || 1.05;
      u.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => /Google|Samantha|Zira|Microsoft/i.test(x.name));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    function initRecognition() {
      if (!SpeechRecognition) return null;
      const r = new SpeechRecognition();
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 1;
      r.continuous = false;

      r.onresult = (e) => {
        const text = e.results[0][0].transcript.toLowerCase();
        handleVoiceCommand(text);
      };
      r.onerror = (e) => {
        if (e.error === 'not-allowed') speak('Microphone permission is required.');
        stopListening();
      };
      r.onend = () => stopListening();
      return r;
    }

    function startListening() {
      if (!SpeechRecognition) {
        showToast('Voice not supported in this browser', 'error');
        speak('Voice recognition is not supported in this browser.');
        return;
      }
      recognition = recognition || initRecognition();
      try {
        recognition.start();
        listening = true;
        voiceFab.classList.add('listening');
        showToast('Listening… say "refresh", "help", or "status"', 'info');
        speak('Listening');
      } catch (err) { console.warn(err); }
    }

    function stopListening() {
      listening = false;
      voiceFab.classList.remove('listening');
    }

    voiceFab.addEventListener('click', () => {
      if (listening) {
        recognition && recognition.stop();
        speak('Voice stopped');
      } else {
        startListening();
      }
    });

    /* ==========================================================
       VOICE COMMANDS
       ========================================================== */
    function handleVoiceCommand(text) {
      console.log('Voice command:', text);
      if (/refresh|reload|new code|another/.test(text)) {
        speak('Refreshing QR code');
        loadQr();
      } else if (/help|guide|how|instructions/.test(text)) {
        speakHelp();
      } else if (/status|what.*status/.test(text)) {
        speakStatus();
      } else if (/download|save/.test(text)) {
        downloadQr();
      } else if (/stop|quiet|mute/.test(text)) {
        voiceEnabled = false;
        showToast('Voice muted', 'info');
      } else if (/enable|unmute/.test(text)) {
        voiceEnabled = true;
        speak('Voice enabled');
        showToast('Voice enabled', 'info');
      } else {
        speak('Sorry, I did not understand. Try saying refresh, help, or status.');
        showToast('Unknown command — try "refresh", "help", or "status"', 'error');
      }
    }

    /* ==========================================================
       HELP + STATUS VOICE
       ========================================================== */
    function speakHelp() {
      speak(
        'Step 1. Open WhatsApp on your phone. ' +
        'Step 2. Tap Linked Devices, then Link a Device. ' +
        'Step 3. Scan the QR code on screen. ' +
        'Say refresh to get a new code, or status to hear the current state.'
      );
      showToast('Voice help reading…', 'info');
    }

    function speakStatus() {
      let msg = 'QR code is not ready yet.';
      if (currentStatus === 'ready') msg = 'QR code is ready. Please scan it now with WhatsApp.';
      else if (currentStatus === 'error') msg = 'There was an error generating the QR code. Tap refresh to try again.';
      else if (currentStatus === 'expired') msg = 'The QR code has expired. Tap refresh to generate a new one.';
      speak(msg);
      showToast(msg, 'info');
    }

    /* ==========================================================
       TOAST
       ========================================================== */
    let toastTimer = null;
    function showToast(text, type = 'info') {
      toastText.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    /* ==========================================================
       STATUS SETTER
       ========================================================== */
    function setStatus(state, text) {
      currentStatus = state === 'loading' ? 'loading'
                    : state === 'error'   ? 'error'
                    : 'ready';

      dot.className = 'badge-dot ' + (state === 'loading' ? 'loading' : state === 'error' ? 'error' : '');
      badge.className = 'badge-text ' + (state === 'loading' ? 'loading' : state === 'error' ? 'error' : '');
      badge.textContent = state === 'loading' ? 'Generating QR'
                        : state === 'error'   ? 'Error'
                        : 'Scan Now';

      statusText.textContent = text;
      statusRow.classList.remove('ok', 'err');
      if (state === 'error') { statusRow.classList.add('err'); }
      else if (state !== 'loading') { statusRow.classList.add('ok'); }

      statusIcon.className = 'fas status-icon ' + (
        state === 'loading' ? 'fa-circle-notch fa-spin' :
        state === 'error'   ? 'fa-exclamation-circle' :
                              'fa-check-circle'
      );

      if (state === 'loading') qrFrame.classList.add('scanning');
      else qrFrame.classList.remove('scanning');
    }

    /* ==========================================================
       TIMER
       ========================================================== */
    function startTimer(seconds) {
      timerBar.style.display = 'block';
      timerLabel.style.display = 'block';
      timerFill.style.transform = 'scaleX(1)';
      timerFill.classList.remove('warn');
      let remaining = seconds;
      timerLabel.textContent = 'QR expires in ' + remaining + 's';

      timerInterval = setInterval(() => {
        remaining--;
        const ratio = remaining / seconds;
        timerFill.style.transform = 'scaleX(' + ratio + ')';
        if (ratio < 0.3) timerFill.classList.add('warn');
        timerLabel.textContent = remaining > 0
          ? 'QR expires in ' + remaining + 's'
          : 'QR expired';
        if (remaining <= 0) {
          clearInterval(timerInterval);
          speak('QR code expired. Refreshing now.');
        }
      }, 1000);

      autoRefreshTimeout = setTimeout(loadQr, seconds * 1000);
    }

    function resetTimer() {
      if (timerInterval) clearInterval(timerInterval);
      if (autoRefreshTimeout) clearTimeout(autoRefreshTimeout);
      timerInterval = null;
      autoRefreshTimeout = null;
      timerBar.style.display = 'none';
      timerLabel.style.display = 'none';
    }

    /* ==========================================================
       LOAD QR
       ========================================================== */
    async function loadQr() {
      resetTimer();
      btnRefresh.style.display = 'none';
      steps.style.display = 'none';
      spinner.style.display = 'flex';
      img.style.display = 'none';
      if (currentQrUrl) { URL.revokeObjectURL(currentQrUrl); currentQrUrl = null; }
      img.src = '';
      setStatus('loading', 'Generating your QR code…');
      speak('Generating QR code');

      try {
        const resp = await fetch('/qr/code?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('Server error ' + resp.status);

        const ct = resp.headers.get('content-type') || '';
        if (ct.includes('image/png')) {
          const blob = await resp.blob();
          currentQrUrl = URL.createObjectURL(blob);
          img.onload = () => {
            spinner.style.display = 'none';
            img.style.display = 'block';
            setStatus('', 'QR ready — scan with WhatsApp now');
            steps.style.display = 'flex';
            startTimer(55);
            speak('QR code ready. Please scan it now.');
            showToast('QR ready — scan with WhatsApp', 'success');
          };
          img.src = currentQrUrl;
        } else {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || 'Unexpected response');
        }
      } catch (e) {
        spinner.style.display = 'none';
        setStatus('error', e.message || 'Failed to generate QR. Please retry.');
        btnRefresh.style.display = 'block';
        speak('Failed to generate QR code. Please tap refresh to try again.');
        showToast('Failed to load QR — tap refresh', 'error');
      }
    }

    /* ==========================================================
       DOWNLOAD QR
       ========================================================== */
    function downloadQr() {
      if (!currentQrUrl) {
        showToast('No QR code to download yet', 'error');
        speak('No QR code to download yet');
        return;
      }
      const a = document.createElement('a');
      a.href = currentQrUrl;
      a.download = 'pk-xmd-qr-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('QR code downloaded', 'success');
      speak('QR code downloaded');
    }

    /* ==========================================================
       BUTTON LISTENERS
       ========================================================== */
    btnSpeak.addEventListener('click', speakStatus);
    btnDownload.addEventListener('click', downloadQr);
    btnHelp.addEventListener('click', speakHelp);

    /* ==========================================================
       KEYBOARD SHORTCUTS
       ========================================================== */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' && !e.ctrlKey && !e.metaKey) loadQr();
      if (e.key === 'h') speakHelp();
      if (e.key === 's') speakStatus();
      if (e.key === 'v') {
        if (listening) recognition && recognition.stop();
        else startListening();
      }
    });

    /* ==========================================================
       INITIAL BOOT
       ========================================================== */
    window.addEventListener('load', () => {
      loadQr();
      setTimeout(() => {
        speak('Welcome to PK X M D QR connect. Tap the mic button to use voice commands.');
      }, 1200);
    });
  </script>
</body>
